<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked – Blockify</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="card">
    <div class="shield" id="shield" aria-hidden="true"></div>
    <h1 id="title">This site may harm your computer</h1>
    <p id="lead" class="lead">Blockify stopped you from opening a site that is known for malware or phishing (fake login and payment pages).</p>
    <p class="host" id="host"></p>
    <div class="actions">
      <button id="back" class="btn primary">Take me back to safety</button>
    </div>
    <details id="more">
      <summary class="muted">Advanced</summary>
      <p class="muted" id="advText">If you are absolutely sure this site is safe, you can open it for this browser session.</p>
      <button id="proceed" class="btn danger">Open anyway (not recommended)</button>
      <a id="settings" href="#" hidden>Manage blocked sites in Settings</a>
    </details>
  </main>
  <script src="../common.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
