<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Searching with Google Lens - KinGuard</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <style>
    [hidden] { display: none !important; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; width: 100%; text-align: center; padding: 24px; box-sizing: border-box; }
    .card p { margin: 0; line-height: 1.5; }
    .card p + p { margin-top: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <p id="status">Opening Google Lens to find where this picture comes from...</p>
    <p id="fallback" hidden>Google Lens didn't open. Save the picture and upload it at lens.google.com.</p>
  </main>
  <script src="../common.js"></script>
  <script src="lens.js"></script>
</body>
</html>
