name: Build & release

# Releases are published automatically when:
#   • a push to main changes the version in manifest.json (no tag for it yet), or
#   • a v* tag is pushed, or
#   • the weekly filter refresh finds list changes (patch version is bumped).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh filter lists
        id: filters
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/update-filters.mjs
          if git diff --quiet -- rules ':!rules/meta.json'; then
            echo "No filter changes"; git checkout -- rules; exit 0
          fi
          V=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const p = m.version.split(".").map(Number); p[2]++;
            m.version = p.join(".");
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
            console.log(m.version);')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules manifest.json
          git commit -m "Update filter lists, v$V"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Detect new version on main
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          V=$(jq -r .version manifest.json)
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already released"
          else
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Static checks
        run: node scripts/check.mjs

      - name: Build packages
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Lint Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: blockify-packages
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || steps.filters.outputs.tag != '' || steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.filters.outputs.tag || steps.version.outputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --target "$(git rev-parse HEAD)" \
            --title "Blockify $TAG" \
            --generate-notes \
            --notes "Install: download **blockify-chrome** (Chrome, Edge, Brave, Opera) or **blockify-firefox** below. See README for setup."
