name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # every Monday: refresh EasyList and release if it changed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh EasyList
        id: filters
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/update-filters.mjs
          if git diff --quiet -- rules/easylist.json rules/cosmetic-generic.css rules/cosmetic.json rules/popup-hosts.json; then
            echo "No filter changes"; git checkout -- rules; exit 0
          fi
          V=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const p = m.version.split(".").map(Number); p[2]++;
            m.version = p.join(".");
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
            console.log(m.version);')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules manifest.json
          git commit -m "Update EasyList to $(jq -r .version rules/meta.json), v$V"
          git tag "v$V"
          git push --atomic origin HEAD:${{ github.event.repository.default_branch }} "v$V"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Static checks
        run: node scripts/check.mjs

      - name: Build packages
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Lint Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: hush-packages
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || steps.filters.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.filters.outputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --generate-notes --title "Hush $TAG"
